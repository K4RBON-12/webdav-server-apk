name: Build APKs

# Runs on GitHub's servers, so no PC / Android Studio is needed.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply legacy + wake-lock patch
        run: git apply legacy-wakelock.patch

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform and build-tools (preinstalled SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build modern + legacy debug APKs
        run: gradle --no-daemon assembleModernDebug assembleLegacyDebug

      - uses: actions/upload-artifact@v4
        with:
          name: webdav-apks
          path: app/build/outputs/apk/**/debug/*.apk
